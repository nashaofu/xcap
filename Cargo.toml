[package]
name = "xcap"
version = "0.9.8"
edition = "2024"
description = "XCap is a cross-platform screen capture library written in Rust. It supports Linux (X11, Wayland), MacOS, Windows, and HarmonyOS (OpenHarmony/OHOS). XCap supports screenshot and video recording (WIP)."
license = "Apache-2.0"
documentation = "https://docs.rs/xcap"
homepage = "https://github.com/nashaofu/xcap"
repository = "https://github.com/nashaofu/xcap.git"
keywords = ["screen", "monitor", "window", "capture", "image"]

[workspace]
members = ["."]
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
image = ["image/default"]
wgc = [
    "windows/Graphics_Capture",
    "windows/Graphics_DirectX_Direct3D11",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_System_WinRT_Direct3D11",
    "windows/Win32_System_WinRT_Graphics_Capture",
]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.35"
scopeguard = "1.2.0"
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
widestring = "1.2.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Devices_Display",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
url = "2.5.8"
ashpd = { git = "https://github.com/bilelmoussaoui/ashpd.git", branch = "main", default-features = false, features = ["async-io", "pipewire", "screencast", "screenshot"] }
pollster = "1.0.1"
rand = "0.10.3"
serde = "1.0.229"
pipewire = "0.10.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
rustix = { version = "1.1.6", features = ["fs", "event"] }
percent-encoding = "2.3.2"
xcb = { version = "1.7.1", features = ["randr"] }

[dev-dependencies]
fs_extra = "1.3.0"

[target.'cfg(target_os="windows")'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_HiDpi"] }
